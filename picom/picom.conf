## Modified to have rules organized to the rules section at bottom, legacy options commented out.

# OPACITY
inactive-opacity = 0.82;
frame-opacity = 1.0;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows.
# inactive-opacity-override = true;

# if for some reason you want all windows transparent
active-opacity = 0.88;

inactive-dim = 0

# fixed inactive dim value
# inactive-dim-fixed = 1.0

# focus-exclude = [ "class_g = 'dwm'" ];

opacity-rule = [
    "0:_NET_WM_STATE@[0]:32a *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[1]:32a *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[2]:32a *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[3]:32a *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE@[4]:32a *= '_NET_WM_STATE_HIDDEN'",

    "100:class_g = 'kitty'",
    "100:class_g = 'i3lock'",

    # Disable for Media Player (vlc, mpv, ...)
    "100:class_g = 'vlc'",
    "100:class_g = 'mpv'",

    # Disable for Document Rendering
    "100:class_g = 'okular'",
    "100:class_g = 'qpdfview'",
    "100:class_g = 'Zathura'",
    "100:class_g = 'Zotero'",
    "100:class_g = 'flameshot'",

    # Disable for Gnome applications
    "100:class_g = 'gnome-calendar'",
    
    # Disable transparent for specific Browser's websites
    "100:class_g = 'Vivaldi-stable' && name *= 'YouTube'",
    "100:class_g = 'Vivaldi-stable' && name *= 'GitHub'"
];

# ROUNDED CORNERS
# corner-radius = 9;

# uncommented for square notification box
# rounded-corners-exclude = [
  # "class_g = 'Dunst'"
# ];


# BLURRING
# methods: none, gaussian, box, kernel (define custom kernel), dual_kawase

blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 2;
# default deviation is 0.84
# deviation = false;
};

# semi-transparent
blur-background = true;

# blur-background-frame = true
# Use fixed blur strength rather than adjusting according to window opacity.
blur-background-fixed = true;

# set custom blur kernel (method to kernel), preset examples:
# blur-kern = "3x3box";
# blur-kern = "5x5gaussian";


# SHADOWS
# shadow = true; # this allows me to toggle on shadows solely for qutebrowser, to create a muted/blurred look behind tabs when combined with qutebrowser's transparent tabs setting.
shadow = false;
shadow-radius = 1; # blur radius
shadow-opacity = 0.99;

shadow-offset-x = 0;
shadow-offset-y = 0;

# shadow-color = "#000000"
shadow-color = "#393943" # this could be set with a pywal template instead
# shadow-exclude = [];


# FADING
fading = false;

# fade-in-step = 0.03;
# fade-out-step = 0.03;
# fade-delta = 20


# OTHER SETTINGS
# dbus = true
# daemon = false

# backends: `xrender`, `glx`, `egl` or `xr_glx_hybrid`
backend = "glx";

# dithered-present = false;
# vsync = true;

# mark-wmwin-focused = true;

# mark-ovredir-focused = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
# glx-no-stencil = true
use-damage = true;
log-level = "warn";

